# Inventory: the machines Ansible manages, and how to reach them.
#
# Hosts are organised into groups. A group called "all" always exists and holds every host.
# This file defines one group, "homelab", with one host in it. site.yml targets the group
# (`hosts: homelab`), so a second Pi added under `hosts:` gets the same setup.
#
# The host name, ada-pi-server, is also the name of its folder under host_vars/.
# That is how Ansible knows which variables belong to which host.
#
# Useful commands (run from ansible/):
#   ansible-inventory --graph                  # show groups and the hosts in them
#   ansible-inventory --host ada-pi-server     # show every variable this host ends up with
#   ansible homelab -m ansible.builtin.ping    # check that SSH and Python on the Pi work

homelab:
  hosts:
    ada-pi-server:
      # The address SSH connects to. Over Tailscale, MagicDNS resolves the bare hostname.
      # A fresh Pi isn't on the tailnet yet, so for the first run override this on the
      # command line with its LAN name:
      #   ansible-playbook site.yml -e ansible_host=ada-pi-server.local
      ansible_host: ada-pi-server

      # The user SSH logs in as. Tasks that need root use sudo on top of this ("become").
      ansible_user: ada
