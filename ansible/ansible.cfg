# ansible.cfg: settings for every `ansible`, `ansible-playbook`, and `ansible-vault`
# command run from this directory.
#
# Ansible reads only ONE config file: the first one it finds in this order.
#   1. the file named in $ANSIBLE_CONFIG
#   2. ./ansible.cfg in the current directory   <- this file
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
# So run commands from the ansible/ directory, or this file is ignored.
# `ansible --version` prints "config file = ..." if you need to check which one is in use.
#
# Ansible also ignores ./ansible.cfg when the directory is world-writable, as a
# security measure. That can happen under /mnt/c in WSL, but not under your Linux home.
#
# To list every setting that differs from the defaults: ansible-config dump --only-changed

[defaults]
# The default inventory: which hosts exist and how to reach them.
# Use a different one per command with -i, for example a private inventory for another lab.
inventory = inventory/hosts.yml

# Where Ansible looks for the roles named in site.yml.
roles_path = roles

# Let Ansible find Python on the Pi by itself, without a warning about which one it picked.
interpreter_python = auto_silent

# Show task results as readable, multi-line YAML instead of one long JSON line.
callback_result_format = yaml

[ssh_connection]
# Pipelining runs each module through the already-open SSH session instead of copying a
# temporary file to the Pi first. It makes runs noticeably faster. It needs sudo without
# "requiretty", which is Debian's default.
pipelining = True
