# Defaults for the docker role. Override any of these in inventory host_vars/.

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# DNS servers for containers, written to /etc/docker/daemon.json. Containers use these
# public resolvers instead of the host's.
docker_dns:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1
