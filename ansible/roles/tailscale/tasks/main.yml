# Tasks for the tailscale role: install Tailscale and start its daemon.
#
# Joining the tailnet (`sudo tailscale up`) is still a manual step for now; see
# provisioning/README.md step 3. It could be automated later with an auth key from the vault.
#
# Same pattern as the docker role (see the comments there): replace the old one-line
# repository file with a deb822 .sources file, install (refreshing apt first if the
# repository changed), then start the service.

- name: Remove the old-format Tailscale repository files written by provisioning.sh
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/tailscale.list
    - /usr/share/keyrings/tailscale-archive-keyring.gpg

# Tailscale publishes its key as a binary keyring (.noarmor.gpg). deb822_repository detects
# that and saves it as /etc/apt/keyrings/tailscale.gpg rather than a .asc file.
- name: Add Tailscale's apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    install_python_debian: true
  register: tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_repo is changed }}"

- name: Enable and start the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
